<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- DevTools -->
    <script src="https://unpkg.com/eruda"></script>
    <script>eruda.init();</script>

    <title>Type Fast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="everything">
    <div id="typing-display">
        <div id="cursorMove"></div>
    </div>
    
    <div id="UI">
        <div id="difficulty-selections">
        <button id="easyButton">Easy</button>
        <button id="mediumButton">Medium</button>
        <button id="hardButton">Hard</button>
    </div>
    <div id="mode-selection">
        <button id="phraseButton">Phrases</button>
        <button id="wordButton">Words</button>
    </div>
    <div id="live-ui">
            <span id="liveWpm">WPM: 0</span>
            <span id="liveAcc">Acc: 100%</span>
    </div>
    <div id="targetGoal">
        <div>Try to hit a WPM between <span id="goalWpm">0-0</span></div>
       <div>And an Accuracy over <span id="goalAcc">0%</span></div>
    </div>
</div>
</div>
<script src="./scripts/words.js"></script>
<script src="./scripts/upgrades.js"></script>
<script src="./scripts/game.js"></script>
<script src="./scripts/UI.js"></script>

<script src="./scripts/typing.js"></script>



</body>
</html>
